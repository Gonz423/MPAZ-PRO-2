version: '3.8'

# MPAZ PRO 2 - Orquestacion de microservicios Spring Boot
# Microservicios: ms-usuarios (8081), ms-contenidos (8082), ms-progreso (8083)
# Uso: docker-compose up --build
# Swagger: 
#   - ms-usuarios:   http://localhost:8081/swagger-ui.html
#   - ms-contenidos: http://localhost:8082/swagger-ui.html
#   - ms-progreso:   http://localhost:8083/swagger-ui.html

services:
  ms-usuarios:
    build: ./ms-usuarios
    container_name: mpaz-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=mpazpro2secretkey123456789012345678901234567890!
    networks:
      - mpaz-net
    restart: unless-stopped

  ms-contenidos:
    build: ./ms-contenidos
    container_name: mpaz-ms-contenidos
    ports:
      - "8082:8082"
    environment:
      - JWT_SECRET=mpazpro2secretkey123456789012345678901234567890!
    networks:
      - mpaz-net
    restart: unless-stopped

  ms-progreso:
    build: ./ms-progreso
    container_name: mpaz-ms-progreso
    ports:
      - "8083:8083"
    environment:
      - JWT_SECRET=mpazpro2secretkey123456789012345678901234567890!
    networks:
      - mpaz-net
    restart: unless-stopped

networks:
  mpaz-net:
    driver: bridge
