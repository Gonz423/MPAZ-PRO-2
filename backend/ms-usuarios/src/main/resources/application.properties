spring.application.name=ms-usuarios
server.port=8081

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuración JWT (clave de 256 bits compatible con HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:mpazpro2secretkey123456789012345678901234567890!}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
