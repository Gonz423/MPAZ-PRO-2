spring.application.name=ms-contenidos
server.port=8082

# Perfil por defecto: local (H2 en archivo). En Docker se usa SPRING_PROFILES_ACTIVE=docker (MySQL).
spring.profiles.default=local

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:mpaz-dev-only-secret-cambiar-en-produccion-0123456789}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator (healthcheck de Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
