# Perfil docker: base de datos MySQL propia del servicio (contenedor db-contenidos).
spring.datasource.url=jdbc:mysql://${DB_HOST:db-contenidos}:3306/${DB_NAME:mpaz_contenidos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
