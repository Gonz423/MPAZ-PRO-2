spring.application.name=ms-usuarios
server.port=8081

# Perfil por defecto: local (H2 en archivo). En Docker se usa SPRING_PROFILES_ACTIVE=docker (MySQL).
spring.profiles.default=local

spring.jpa.open-in-view=false

# JWT (HMAC-SHA256, minimo 32 bytes). En Docker se entrega por la variable JWT_SECRET del archivo .env
app.jwt.secret=${JWT_SECRET:mpaz-dev-only-secret-cambiar-en-produccion-0123456789}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator (healthcheck de Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
