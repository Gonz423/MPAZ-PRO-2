spring.application.name=ms-usuarios
server.port=8081

# H2 en memoria - desarrollo sin instalar base de datos
spring.datasource.url=jdbc:h2:mem:mpaz_usuarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT - mismo patron que Tienda_Musica_Backend
app.jwt.secret=${JWT_SECRET:mpazpro2secretkey123456789012345678901234567890!}
app.jwt.issuer=mpaz-pro-usuarios
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
