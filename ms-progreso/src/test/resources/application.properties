# Configuracion de pruebas: H2 en memoria, se recrea en cada ejecucion.
spring.application.name=ms-progreso
spring.datasource.url=jdbc:h2:mem:progreso_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=mpaz-test-secret-0123456789-0123456789-0123456789
